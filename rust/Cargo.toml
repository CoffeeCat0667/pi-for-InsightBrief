[package]
name = "pi_agent"
version = "0.1.9"
edition = "2021"
description = "Pi Agent - A coding agent with session management and context compaction"
license = "MIT"

[lib]
name = "pi_agent"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
