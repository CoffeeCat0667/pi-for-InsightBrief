name: Build Wheels

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            maturin-args: --release
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin-args: --release --manylinux 2_17
          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            maturin-args: --release
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            maturin-args: --release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.maturin-args }}
          sccache: "true"
          manylinux: auto-container

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{{ matrix.target }}}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pi-agent
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive dist/*
